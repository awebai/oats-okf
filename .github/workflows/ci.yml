name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and run unit tests
        run: npm test
      - name: Consumer coverage disclosure (not a probe)
        run: |
          echo "NOT RUN: installed-artifact acquire/lock/trust/activate/scaffold/retire and real harness learning gates."
          echo "npm test covers the exported payload with a fake OATS boundary; see SCHEMA-STATUS.md for required consumer evidence."
