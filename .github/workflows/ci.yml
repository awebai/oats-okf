name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      consumer_version:
        description: 'Optional exact published @awebai/oats version (>=0.23.0); empty skips consumer probes'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exported manifests and run the complete standalone v2 suite
        run: npm test
      - name: Report default coverage limits (not a consumer probe)
        run: |
          echo "npm test covers the exported v2 payload, schema parity/mutations and disposable Git/directory custody."
          echo "SKIPPED in this standalone step: public CLI scaffold and native probes."
          echo "The separate schedule-deployment-041 job qualifies the external-repo regression on released OATS 0.41.0."
          echo "NOT COVERED: OKF acquire/lock/restore/trust, remote GitHub PRs or fresh real-model learning."
          echo "Use workflow_dispatch with an exact published consumer_version for the optional public CLI job; see SCHEMA-STATUS.md."

  schedule-deployment-041:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the released OATS 0.41.0 kernel in a disposable prefix
        run: |
          npm install --prefix "$RUNNER_TEMP/okf-schedule-kernel" --ignore-scripts --no-audit --no-fund --package-lock=false @awebai/oats@0.41.0
          echo "OATS_OKF_SCHEDULE_CLI=$RUNNER_TEMP/okf-schedule-kernel/node_modules/@awebai/oats/bin/oats.mjs" >> "$GITHUB_ENV"
      - name: Released v4.1.1 negative control must reproduce the external-repo scope defect
        run: |
          mkdir -p "$RUNNER_TEMP/okf-schedule-baseline"
          git archive e1d604f70c5e4cdc39602095f139383e61f69323 oats-package | tar -x -C "$RUNNER_TEMP/okf-schedule-baseline"
          if OATS_OKF_SCHEDULE_PAYLOAD="$RUNNER_TEMP/okf-schedule-baseline/oats-package" node --test --test-reporter=spec test/schedule-deployment-consumer.test.mjs > "$RUNNER_TEMP/okf-schedule-baseline.log" 2>&1; then
            echo 'Baseline unexpectedly passed'; exit 1
          fi
          grep -F 'schedules belong to a workspace deployment' "$RUNNER_TEMP/okf-schedule-baseline.log"
      - name: Real external-repo spawn, scheduler and retire regression
        run: |
          set -o pipefail
          node "$OATS_OKF_SCHEDULE_CLI" --version
          node --test --test-reporter=spec test/schedule-deployment-consumer.test.mjs | tee "$RUNNER_TEMP/okf-schedule-result.txt"
          grep -F 'ℹ skipped 0' "$RUNNER_TEMP/okf-schedule-result.txt"
      - name: Evidence boundary
        run: |
          echo 'Real released 0.41.0 CLI; isolated file-Git workspace and external worktree; provider payload from this exact checkout.'
          echo 'No model, host timer, messaging cleanup, GitHub publication or production deployment is qualified by this fixture.'

  public-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_version != ''
    runs-on: ubuntu-latest
    env:
      CONSUMER_VERSION: ${{ inputs.consumer_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require an exact stable version at or above the declared floor
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const version=process.env.CONSUMER_VERSION;
          assert.match(version,/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,'supply an exact published version, not a tag/range/source');
          const capability=JSON.parse(readFileSync('oats-package/oats-package.json')).capabilities[0];
          const floor=JSON.parse(readFileSync(`oats-package/${capability}/oats.json`)).compatibility.oats;
          assert.match(floor,/^>=\d+\.\d+\.\d+$/,'update this gate if the compatibility expression changes');
          const requested=version.split('.').map(Number), minimum=floor.slice(2).split('.').map(Number);
          const different=requested.findIndex((v,i)=>v!==minimum[i]);
          assert.ok(different===-1 || requested[different]>minimum[different],`consumer must satisfy ${floor}`);
          NODE
      - name: Install only the selected public kernel in a disposable prefix
        run: |
          npm install --prefix "$RUNNER_TEMP/okf-consumer-kernel" --ignore-scripts --no-audit --no-fund --package-lock=false "@awebai/oats@$CONSUMER_VERSION"
          node -e 'const p=require(process.argv[1]); if(p.version!==process.env.CONSUMER_VERSION) throw Error("consumer version mismatch"); console.log("Public consumer:",p.name,p.version)' "$RUNNER_TEMP/okf-consumer-kernel/node_modules/@awebai/oats/package.json"
          echo "OATS_OKF_CONSUMER_CLI=$RUNNER_TEMP/okf-consumer-kernel/node_modules/@awebai/oats/bin/oats.mjs" >> "$GITHUB_ENV"
      - name: Run v2 suite including public CLI scaffold and native probes
        run: |
          test -f "$OATS_OKF_CONSUMER_CLI"
          npm test
      - name: Report consumer evidence boundaries
        run: |
          echo "This job uses an installed public kernel with the enumerated OKF source payload in disposable owned-capability fixtures."
          echo "No model is launched, no host timer is installed, and no real GitHub PR is created."
          echo "This is NOT an OKF distribution acquire/lock/restore/trust probe or fresh real-model learning."
